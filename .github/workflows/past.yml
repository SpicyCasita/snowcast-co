name: past-snowfall

on:
  schedule:
    # 12:00 UTC = 5am MST (6am MDT): fresh overnight totals, published before the alerts
    # Worker's morning run at 13:00 UTC (MORNING_CRON in worker/src/index.ts).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: past-snowfall
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: pip install -r pipeline/requirements.txt

      - run: npm ci
        working-directory: app

      # Read-only: reuses the CoCoRaHS month cache and gauge elevations; pipeline.yml owns saving it.
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Recent observations at each location's nearest station
        working-directory: pipeline
        run: python recent_obs.py

      - name: Day-before forecasts vs actual
        working-directory: app
        run: npx --yes tsx scripts/past-snowfall.ts

      # Pushes made with GITHUB_TOKEN don't trigger workflows, hence the explicit dispatch.
      - name: Publish past-snowfall.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/past-snowfall.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update past-snowfall.json"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref ${{ github.ref_name }}
