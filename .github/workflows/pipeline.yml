name: pipeline

on:
  schedule:
    - cron: "30 10 * * *" # nightly 03:30 MST: SNOTEL obs + forecast backfill
    - cron: "30 22 * * *" # 15:30 MST: second backfill pass, using the rest of the daily API allowance
    - cron: "0 12 * * 0" # Sundays: refit bias/skill weights and publish
  workflow_dispatch:
    inputs:
      refit:
        description: "Refit weights and publish weights.json"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest -q

      # Parquet files and the per-site-month Open-Meteo cache persist between
      # runs, so the multi-day backfill resumes where the last run stopped.
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Fetch SNOTEL observations
        run: python fetch_snotel.py

      - name: Fetch archived model forecasts
        # Open-Meteo's free tier allows 5k calls/hour and 10k/day, so two runs a day of
        # 4.5k each. Newest months are fetched first; a rate limit stops downloads cleanly.
        run: python fetch_forecasts.py --sites all --budget 4500

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}

      - name: Refit weights
        if: github.event.schedule == '0 12 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.refit)
        run: python bias.py

      # The app ships weights.json from app/public/data, so commit it there and redeploy.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, hence the explicit dispatch.
      - name: Publish weights.json to the app
        if: github.event.schedule == '0 12 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.refit)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/public/data
          cp pipeline/out/weights.json app/public/data/weights.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/weights.json pipeline/out/weights.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refit weights.json"
          git push
          gh workflow run deploy.yml --ref ${{ github.ref_name }}
