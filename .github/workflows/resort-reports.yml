name: resort-reports

on:
  schedule:
    # Resorts post their morning reports ~5-7am MT. 14:45 UTC = 7:45am MST; 17:30 UTC catches late posts.
    - cron: "45 14 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: resort-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Resort-reported snowfall
        working-directory: pipeline
        run: python fetch_resort_reports.py

      # Pushes made with GITHUB_TOKEN don't trigger workflows, hence the explicit dispatch.
      - name: Publish resort-reports.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/resort-reports.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update resort-reports.json"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref ${{ github.ref_name }}
